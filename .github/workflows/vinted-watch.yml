name: Vinted Watcher

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: vinted-watcher
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - name: Set start timestamp
        id: start_time
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HTTP_TIMEOUT: '30'
          MAX_ALERTS: '10'
        run: python main.py

      - name: Commit seen_items.json if changed
        run: |
          if git diff --quiet seen_items.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_items.json
          git commit -m "Update seen items"
          git pull --rebase origin main
          git push

      - name: Print total duration
        if: always()
        run: |
          end_ts=$(date +%s)
          start_ts=${{ steps.start_time.outputs.ts }}
          duration=$((end_ts - start_ts))
          echo "TOTAL_DURATION_SECONDS=$duration"
          echo "TOTAL_DURATION_MINUTES=$((duration / 60))"
